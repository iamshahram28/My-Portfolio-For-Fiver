<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shahram Khan | Content Writer, Copywriter & Front-End Developer</title>
<meta name="description" content="Shahram Khan is a content writer, copywriter, social media specialist and front-end developer. Hire him for website content, ad copy, essays, reports and clean front-end websites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1222;--ink-2:#121C33;--line:rgba(244,240,230,.14);--ivory:#F4F0E6;--mute:#A9B0C0;--brass:#C8A45D;--brass-2:#E3C98F;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--ink);color:var(--ivory);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{font-family:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px;position:relative}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.05;letter-spacing:-.01em}
h2{font-size:clamp(2.2rem,4.6vw,3.6rem);margin-bottom:18px}
section{padding:110px 0;position:relative}
.lead{color:var(--mute);max-width:56ch}
.tag{display:inline-block;margin-bottom:16px;color:var(--brass);font-size:.88rem;font-weight:500}

/* loader, progress, glow, aurora */
#loader{position:fixed;inset:0;z-index:100;background:var(--ink);display:grid;place-items:center;transition:transform .9s cubic-bezier(.76,0,.24,1)}
#loader.hide{transform:translateY(-100%)}
#loader div{font-family:var(--serif);font-size:clamp(2.4rem,7vw,4.5rem);letter-spacing:.04em;overflow:hidden}
#loader span{display:block;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
#loader i{display:block;height:1px;background:var(--brass);margin-top:14px;transform-origin:left;animation:grow 1.2s .2s ease both}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--brass),var(--brass-2));z-index:60}
#glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(200,164,93,.10),transparent 65%);transform:translate(var(--mx,50vw),var(--my,30vh))}
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.aurora b{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 18s ease-in-out infinite alternate}
.aurora b:nth-child(1){width:520px;height:520px;background:rgba(200,164,93,.22);right:-120px;top:-100px}
.aurora b:nth-child(2){width:460px;height:460px;background:rgba(60,90,170,.25);left:-160px;bottom:-60px;animation-delay:-6s}
@keyframes float{to{transform:translate(-60px,50px) scale(1.15)}}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* nav */
nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
nav.on{background:rgba(11,18,34,.85);backdrop-filter:blur(12px);border-color:var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font-family:var(--serif);font-size:1.5rem;font-weight:600;letter-spacing:.02em}.logo span{color:var(--brass)}
.links{display:flex;gap:34px;align-items:center;font-size:.95rem;color:var(--mute)}
.links a:not(.btn):hover{color:var(--ivory)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:999px;font-weight:600;font-size:.95rem;border:1px solid var(--brass);background:none;color:var(--ivory);cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.btn.fill{background:var(--brass);color:var(--ink)}
.btn.fill:hover{background:var(--brass-2);box-shadow:0 10px 30px rgba(200,164,93,.3)}
.btn.ghost:hover{background:rgba(200,164,93,.12)}
.links .btn{padding:10px 22px}

/* hero */
.hero{min-height:100vh;display:flex;align-items:center;padding:130px 0 80px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:70px;align-items:center}
.hero h1{font-size:clamp(3.6rem,9vw,7.6rem);margin-bottom:22px}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln span{display:block;transform:translateY(105%);animation:rise 1.1s var(--d,2s) cubic-bezier(.2,.8,.2,1) forwards}
.ln.it span{font-style:italic;color:var(--brass-2);--d:2.15s}
.typed{color:var(--brass);font-weight:500;margin-bottom:16px;min-height:1.7em}
.typed::after{content:"";display:inline-block;width:2px;height:1.1em;background:var(--brass);margin-left:4px;vertical-align:-.15em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hero .in{opacity:0;animation:fade .9s var(--d,2.4s) ease forwards}
.hero p.lead{font-size:1.15rem;margin-bottom:36px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.stats{display:flex;gap:46px;margin-top:54px}
.stats b{display:block;font-family:var(--serif);font-size:2.6rem;font-weight:500;line-height:1;color:var(--brass-2)}
.stats span{color:var(--mute);font-size:.9rem}
.portrait{max-width:430px;margin-left:auto;perspective:900px;opacity:0;animation:fade 1.2s 2.2s ease forwards}
.tilt{position:relative;transition:transform .2s ease-out;transform-style:preserve-3d}
.arch{border-radius:999px 999px 24px 24px;overflow:hidden;aspect-ratio:4/5;position:relative;z-index:1;background:var(--ink-2)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.tilt::after{content:"";position:absolute;inset:18px -18px -18px 18px;border:1px solid var(--brass);border-radius:999px 999px 24px 24px}
.badge{position:absolute;z-index:2;left:-34px;bottom:46px;background:var(--ink-2);border:1px solid var(--line);padding:14px 20px;border-radius:14px;font-size:.85rem;line-height:1.35;box-shadow:0 18px 40px rgba(0,0,0,.35);transform:translateZ(50px)}
.badge b{display:block;font-family:var(--serif);font-size:1.25rem;font-weight:600;color:var(--brass-2)}

/* marquee */
.marq{border-block:1px solid var(--line);overflow:hidden;padding:22px 0;background:var(--ink-2)}
.marq div{display:flex;gap:56px;width:max-content;animation:slide 28s linear infinite}
.marq:hover div{animation-play-state:paused}
.marq span{font-family:var(--serif);font-size:1.7rem;color:var(--mute);white-space:nowrap}
.marq span::after{content:"";display:inline-block;width:7px;height:7px;background:var(--brass);transform:rotate(45deg);margin-left:56px;vertical-align:middle}
@keyframes slide{to{transform:translateX(-50%)}}

/* services */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:40px 0 34px}
.tabs button{padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;font-size:.95rem;transition:all .25s}
.tabs button:hover{color:var(--ivory);border-color:var(--brass)}
.tabs button.on{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.svc{padding:28px;border:1px solid var(--line);border-radius:18px;animation:pop .5s ease both;position:relative;overflow:hidden}
.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,rgba(244,240,230,.04),transparent);transition:border-color .3s}
.card::before,.svc::before{content:"";position:absolute;inset:0;background:radial-gradient(300px circle at var(--x,50%) var(--y,0),rgba(200,164,93,.16),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before,.svc:hover::before{opacity:1}.card:hover,.svc:hover{border-color:var(--brass)}
.svc h3{font-size:1.5rem;margin-bottom:8px}.svc p{color:var(--mute);font-size:.94rem}.svc small{color:var(--brass);font-size:.82rem}

/* experience */
.alt{background:var(--ink-2);border-block:1px solid var(--line)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.proj{list-style:none;margin-top:30px}
.proj li{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.proj svg{flex:none;margin-top:5px;color:var(--brass)}
.skills{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.skills span{padding:9px 20px;border:1px solid var(--line);border-radius:999px;font-size:.92rem;transition:all .25s}
.skills span:hover{border-color:var(--brass);color:var(--brass-2);transform:translateY(-3px)}

/* internship */
.intern{margin-top:50px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.intern .card{padding:34px 30px}.intern h3{font-size:1.8rem;margin-bottom:12px}.intern p{color:var(--mute);font-size:.97rem}
.feature{display:grid;grid-template-columns:1fr 360px;gap:70px;align-items:center;margin-top:110px}
.feature .btn{margin-top:30px}
.calc{background:#0A101D;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 40px 80px rgba(0,0,0,.45);outline-offset:6px}
.screen{background:var(--ink);border-radius:16px;padding:16px 20px;text-align:right;margin-bottom:16px;min-height:90px;display:flex;flex-direction:column;justify-content:flex-end}
.screen small{color:var(--mute);min-height:1.4em;font-size:.85rem}
.screen output{font-family:var(--serif);font-size:2.6rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{font:500 1.1rem var(--sans);padding:15px 0;border-radius:14px;border:0;background:var(--ink-2);color:var(--ivory);cursor:pointer;transition:background .2s,transform .12s}
.keys button:hover{background:#1c2947}.keys button:active{transform:scale(.93)}
.keys .op{background:rgba(200,164,93,.18);color:var(--brass-2)}.keys .eq{background:var(--brass);color:var(--ink)}.keys .eq:hover{background:var(--brass-2)}.keys .z{grid-column:span 2}

/* contact */
.contact h2{font-size:clamp(2.6rem,6vw,5rem);max-width:14ch}
.cwrap{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.brief{border:1px solid var(--line);border-radius:22px;padding:32px;background:rgba(11,18,34,.6)}
.brief label{display:block;font-weight:500;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chips button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;font-size:.88rem;transition:all .2s}
.chips button:hover{border-color:var(--brass);color:var(--ivory)}.chips button.on{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}
.brief textarea{width:100%;min-height:120px;resize:vertical;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ivory);font:inherit;margin-bottom:22px}
.brief textarea:focus{outline:none;border-color:var(--brass)}
.brief .btn{width:100%;justify-content:center}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mute);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s ease var(--rd,0s),transform .8s ease var(--rd,0s)}.rv.show{opacity:1;transform:none}

@media (max-width:900px){
section{padding:80px 0}.links a:not(.btn){display:none}
.hero .wrap,.split,.feature,.cwrap{grid-template-columns:1fr;gap:56px}
.portrait{margin:0 auto;max-width:340px}.badge{left:-10px}
.grid,.intern{grid-template-columns:1fr 1fr}.calc{max-width:360px}.stats{gap:30px}
#glow{display:none}}
@media (max-width:600px){.grid,.intern{grid-template-columns:1fr}.wrap{padding:0 20px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
.ln span,.hero .in,.portrait,.rv{opacity:1;transform:none}#loader{display:none}}
</style>
</head>

/* calculator */
const SY={"/":"÷","*":"×","-":"−","+":"+"};
const KEYS=[["C","C","op"],["±","±","op"],["%","%","op"],["/","÷","op"],["7","7"],["8","8"],["9","9"],["*","×","op"],["4","4"],["5","5"],["6","6"],["-","−","op"],["1","1"],["2","2"],["3","3"],["+","+","op"],["0","0","z"],[".","."],["=","=","eq"]];
const fmt=n=>Number.isFinite(n)?String(+n.toPrecision(10)):"Error";
const ev=(a,b,o)=>o==="+"?a+b:o==="-"?a-b:o==="*"?a*b:b===0?NaN:a/b;
function step(s,k){let{cur,prev,op,fresh,hist}=s;
  if(/\d/.test(k)){cur=(fresh||cur==="0"||cur==="Error")?k:cur+k;fresh=false}
  else if(k==="."){if(fresh||cur==="Error"){cur="0.";fresh=false}else if(!cur.includes("."))cur+="."}
  else if(k==="C"){cur="0";prev=null;op=null;hist=""}
  else if(k==="±"){if(cur!=="0"&&cur!=="Error")cur=cur[0]==="-"?cur.slice(1):"-"+cur}
  else if(k==="%"){if(cur!=="Error")cur=fmt(parseFloat(cur)/100)}
  else if(k==="="){if(op&&prev!==null){hist=`${prev} ${SY[op]} ${cur} =`;cur=fmt(ev(prev,parseFloat(cur),op));prev=null;op=null;fresh=true}}
  else{if(op&&prev!==null&&!fresh)cur=fmt(ev(prev,parseFloat(cur),op));
    if(cur==="Error"){prev=null;op=null;hist=""}else{prev=parseFloat(cur);op=k;fresh=true;hist=`${cur} ${SY[k]}`}}
  return{cur,prev,op,fresh,hist}}
function Calc(){const[s,set]=useState({cur:"0",prev:null,op:null,fresh:false,hist:""});
  const press=k=>set(x=>step(x,k));
  const kd=e=>{const m={Enter:"=",Escape:"C",c:"C",C:"C"},k=m[e.key]||e.key;if(/^[\d.+\-*/%=]$|^C$/.test(k)){e.preventDefault();press(k)}};
  return h("div",{className:"calc",tabIndex:0,onKeyDown:kd,"aria-label":"Working calculator demo. Click or use your keyboard."},
    h("div",{className:"screen"},h("small",null,s.hist),h("output",null,s.cur)),
    h("div",{className:"keys"},KEYS.map(([k,l,c])=>h("button",{key:k,className:c||"",onClick:()=>press(k),tabIndex:-1},l))))}
